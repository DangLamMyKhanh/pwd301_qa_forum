services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pwd301_qa_forum
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      # Cấu hình chuỗi kết nối SQL Server (dùng host.docker.internal để kết nối tới SQL Server trên máy host)
      - DB_SERVER=host.docker.internal
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-qa_forum_db}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-1}
      # Khóa bảo mật hệ thống & JWT
      - SECRET_KEY=${SECRET_KEY:-pwd301-qa-forum-flask-secret-key-2026}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-pwd301-qa-forum-jwt-access-secret-2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount thư mục dự án để tự reload code khi chỉnh sửa
      - .:/app
    stdin_open: true
    tty: true
