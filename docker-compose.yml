version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pwd301_qa_forum
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      # Cấu hình biến môi trường kết nối database 
      - SECRET_KEY=dev_secret_key_12345
    volumes:
      # Mount thư mục dự án để tự reload code khi chỉnh sửa
      - .:/app
    stdin_open: true
    tty: true

