<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Q&A Forum</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="bg-light">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <!-- Logo / Tên website -->
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-comments me-2"></i>
                Student Q&A Forum
            </a>

            <!-- Nút 3 gạch khi ở điện thoại -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Nội dung Navbar -->
            <div class="collapse navbar-collapse" id="mainNavbar">

                <!-- Search bar -->
                <form class="d-flex mx-lg-auto my-3 my-lg-0 w-50" role="search">
                    <input
                        class="form-control me-2"
                        type="search"
                        placeholder="Tìm kiếm câu hỏi..."
                        aria-label="Search"
                    >

                    <button class="btn btn-light" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>

                <!-- Đăng nhập / Đăng ký -->
                <div class="d-flex gap-2">
                    <a href="login.html" class="btn btn-outline-light">
                        Đăng nhập
                    </a>

                    <a href="register.html" class="btn btn-warning">
                        Đăng ký
                    </a>
                </div>

            </div>
        </div>
    </nav>


    <!-- NỘI DUNG TRANG -->
    <main class="container py-5">

        <div class="text-center py-5">
            <h1 class="fw-bold">Student Q&A Forum</h1>

            <p class="text-secondary mt-3">
                Nơi sinh viên đặt câu hỏi, chia sẻ kiến thức
                và hỗ trợ nhau trong học tập.
            </p>

            <a href="#" class="btn btn-primary mt-2">
                Xem câu hỏi
            </a>
        </div>

    </main>


    <!-- FOOTER -->
    <footer class="bg-dark text-light text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-1 fw-semibold">
                Student Q&A Forum
            </p>

            <small class="text-secondary">
                © 2026 Student Q&A Forum. All rights reserved.
            </small>
        </div>
    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
