<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - Student Q&A Forum</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="base.html">
                <i class="fa-solid fa-comments me-2"></i>
                Student Q&A Forum
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <form class="d-flex mx-lg-auto my-3 my-lg-0 w-50">
                    <input
                        class="form-control me-2"
                        type="search"
                        placeholder="Tìm kiếm câu hỏi..."
                    >

                    <button class="btn btn-light" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>

                <div class="d-flex gap-2">
                    <a href="login.html" class="btn btn-outline-light">
                        Đăng nhập
                    </a>

                    <a href="register.html" class="btn btn-warning">
                        Đăng ký
                    </a>
                </div>

            </div>
        </div>
    </nav>


    <!-- REGISTER -->
    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <div class="text-center mb-4">

                            <i class="fa-solid fa-user-plus fa-3x text-primary mb-3"></i>

                            <h3 class="fw-bold">
                                Tạo tài khoản
                            </h3>

                            <p class="text-secondary mb-0">
                                Tham gia Student Q&A Forum ngay hôm nay
                            </p>

                        </div>


                        <form>

                            <!-- Username -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Tên hiển thị
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-user"></i>
                                    </span>

                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="Nhập username"
                                        required
                                    >

                                </div>
                            </div>


                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Email
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>

                                    <input
                                        type="email"
                                        class="form-control"
                                        placeholder="Nhập email"
                                        required
                                    >

                                </div>
                            </div>


                            <!-- Password -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Mật khẩu
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>

                                    <input
                                        type="password"
                                        class="form-control"
                                        placeholder="Nhập mật khẩu"
                                        required
                                    >

                                </div>
                            </div>


                            <!-- Confirm Password -->
                            <div class="mb-4">
                                <label class="form-label">
                                    Nhập lại mật khẩu
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>

                                    <input
                                        type="password"
                                        class="form-control"
                                        placeholder="Nhập lại mật khẩu"
                                        required
                                    >

                                </div>
                            </div>


                            <!-- Register Button -->
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                <i class="fa-solid fa-user-plus me-1"></i>
                                Tạo tài khoản
                            </button>

                        </form>


                        <hr>


                        <p class="text-center mb-0">
                            Đã có tài khoản?
                            <a
                                href="login.html"
                                class="text-decoration-none fw-semibold"
                            >
                                Đăng nhập tại đây
                            </a>
                        </p>

                    </div>
                </div>

            </div>
        </div>

    </main>


    <!-- FOOTER -->
    <footer class="bg-dark text-light text-center py-4">
        <div class="container">

            <p class="mb-1 fw-semibold">
                Student Q&A Forum
            </p>

            <small class="text-secondary">
                © 2026 Student Q&A Forum. All rights reserved.
            </small>

        </div>
    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
